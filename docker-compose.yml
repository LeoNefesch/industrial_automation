services:
  timescaledb:
    image: timescale/timescaledb:latest-pg18-oss
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: industrial
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: industrial-automation:latest
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: industrial
      MODBUS_HOST: modbus-sim
      MODBUS_PORT: 502
      MODBUS_UNIT_ID: 1
#      MODBUS_TEMP_REGISTER: 1
#      MODBUS_SCALE: 10.0
#      OPCUA_URL: opc.tcp://opcua-sim:4840
    depends_on:
      timescaledb:
        condition: service_healthy
      modbus-sim:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv

  worker:
    image: industrial-automation:latest
    entrypoint: []
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: industrial
      MODBUS_HOST: modbus-sim
      MODBUS_PORT: 502
      MODBUS_UNIT_ID: 1
    depends_on:
      timescaledb:
        condition: service_healthy
      modbus-sim:
        condition: service_started
    volumes:
      - .:/app
      - /app/.venv
    command: [ "python", "-m", "worker" ]

#  modbus-sim:
#    image: oitc/modbus-server:latest
#    ports:
#      - "502:5020"
  modbus-sim:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: [ "python", "scripts/modbus_sim.py" ]
    restart: unless-stopped
    ports:
      - "502:502"
    volumes:
      - .:/app
      - /app/.venv

  opcua-sim:
    image: intel/ia-opcua-server:2026.2.0-20260707-weekly
    ports:
      - "4840:4840"

volumes:
  timescale_data:
